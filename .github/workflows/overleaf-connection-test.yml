name: Overleaf Connection Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check remote
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          test -n "$OVERLEAF_TOKEN"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'git:%s' "$OVERLEAF_TOKEN" | base64 -w0)" ls-remote https://git.overleaf.com/650dab8322fcf8db6cee62b2 HEAD
